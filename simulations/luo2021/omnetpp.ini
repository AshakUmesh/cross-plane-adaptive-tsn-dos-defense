[General]
network = Luo2021Network

# ============================================================
# SIMULATION TIME — Luo 2021 Section 5.1: "150ms"
# ============================================================
sim-time-limit = 150ms

# ============================================================
# ETHERNET SPEED — Luo 2021 Section 5.1: "100 Mbps"
# ============================================================
*.*.eth[*].bitrate = 100Mbps

# ============================================================
# SWITCH BUFFER — Luo 2021 Section 5.1: "max 30 packets"
# ============================================================
*.viuSwitch.eth[*].macLayer.queue.packetCapacity = 30
*.vcuSwitch.eth[*].macLayer.queue.packetCapacity = 30

# ============================================================
# TAS — Enable egress traffic shaping (IEEE 802.1Qbv)
# Luo Section 5: "TAS defined in IEEE 802.1Qbv is also applied"
# ============================================================
*.viuSwitch.hasEgressTrafficShaping = true
*.vcuSwitch.hasEgressTrafficShaping = true

# ============================================================
# 8 TRAFFIC CLASSES — Luo uses Q0-Q7
# ============================================================
*.viuSwitch.eth[*].macLayer.queue.numTrafficClasses = 8
*.vcuSwitch.eth[*].macLayer.queue.numTrafficClasses = 8

# ============================================================
# GCL — EXACTLY Luo Table 6
# Cycle = 500us
# Slot 1: 0-125us    → Q7 OPEN only  (Control data, PCP=7)
# Slot 2: 125-450us  → Q0-Q6 OPEN    (AV1, AV2, Radar, PCP=4)
# Slot 3: 450-500us  → ALL CLOSED    (guard band)
#
# INET GCL syntax: durations = [slot1_duration, slot2_duration, slot3_duration]
# initiallyOpen = true means gate opens at start of first slot
# initiallyOpen = false means gate is closed at start of first slot
#
# Q7 (Control, PCP=7): OPEN 0-125us, CLOSED 125-500us
# Durations: [125us, 375us]  initiallyOpen: true
#
# Q0-Q6 (AV+Radar, PCP=4): CLOSED 0-125us, OPEN 125-450us, CLOSED 450-500us
# Durations: [125us, 375us]  initiallyOpen: false
# ============================================================

# Q7 — Control stream (PCP=7): open first 125us only
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[7].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[7].initiallyOpen = true
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[7].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[7].initiallyOpen = true

# Q0-Q6 — AV + Radar streams (PCP=4): open 125-450us
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[0].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[1].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[2].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[2].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[3].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[3].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[4].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[4].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[5].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[5].initiallyOpen = false
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[6].durations = [125us, 375us]
*.viuSwitch.eth[*].macLayer.queue.transmissionGate[6].initiallyOpen = false

*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[0].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[1].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[2].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[2].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[3].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[3].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[4].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[4].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[5].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[5].initiallyOpen = false
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[6].durations = [125us, 375us]
*.vcuSwitch.eth[*].macLayer.queue.transmissionGate[6].initiallyOpen = false

# ============================================================
# PSFP — Enable ingress filtering (IEEE 802.1Qci)
# Luo: ADS strategies applied in switch1 (viuSwitch)
# ============================================================
*.viuSwitch.hasIngressTrafficFiltering = true
*.vcuSwitch.hasIngressTrafficFiltering = true

# ============================================================
# AV1 — Forward camera stream
# Luo Table 5: PCP=4, interval=90us, size=400-500B,
#              startTime=100us, quantity=3 per cycle
# ============================================================
*.av1.numApps = 1
*.av1.app[0].typename = "UdpSourceApp"
*.av1.app[0].io.destAddress = "centralHost"
*.av1.app[0].io.destPort = 5001
*.av1.app[0].source.packetLength = 500B
*.av1.app[0].source.productionInterval = 90us
*.av1.app[0].source.initialProductionOffset = 100us

# Stream identification + PCP encoding — PCP=4 (Luo item 3)
*.av1.hasOutgoingStreams = true
*.av1.bridging.streamIdentifier.identifier.mapping = [{stream: "av1", packetFilter: expr(has(udp) && udp.destPort == 5001)}]
*.av1.bridging.streamCoder.encoder.mapping = [{stream: "av1", pcp: 4}]

# ============================================================
# AV2 — Forward camera stream 2
# Luo Table 5: PCP=4, interval=90us, size=400-500B,
#              startTime=145us (STAGGERED from AV1)
# ============================================================
*.av2.numApps = 1
*.av2.app[0].typename = "UdpSourceApp"
*.av2.app[0].io.destAddress = "centralHost"
*.av2.app[0].io.destPort = 5002
*.av2.app[0].source.packetLength = 500B
*.av2.app[0].source.productionInterval = 90us
*.av2.app[0].source.initialProductionOffset = 145us

# Stream identification + PCP encoding — PCP=4
*.av2.hasOutgoingStreams = true
*.av2.bridging.streamIdentifier.identifier.mapping = [{stream: "av2", packetFilter: expr(has(udp) && udp.destPort == 5002)}]
*.av2.bridging.streamCoder.encoder.mapping = [{stream: "av2", pcp: 4}]

# ============================================================
# RADAR — Radar data stream
# Luo Table 5: PCP=4, interval=500us, size=64B, startTime=100us
# ============================================================
*.radarNode.numApps = 1
*.radarNode.app[0].typename = "UdpSourceApp"
*.radarNode.app[0].io.destAddress = "centralHost"
*.radarNode.app[0].io.destPort = 5003
*.radarNode.app[0].source.packetLength = 64B
*.radarNode.app[0].source.productionInterval = 500us
*.radarNode.app[0].source.initialProductionOffset = 100us

# Stream identification + PCP encoding — PCP=4 (Luo item 4)
*.radarNode.hasOutgoingStreams = true
*.radarNode.bridging.streamIdentifier.identifier.mapping = [{stream: "radar", packetFilter: expr(has(udp) && udp.destPort == 5003)}]
*.radarNode.bridging.streamCoder.encoder.mapping = [{stream: "radar", pcp: 4}]
# ============================================================
# CONTROL — Control data stream
# Luo Table 5: PCP=7 (HIGHEST), interval=500us, size=20B, startTime=0us
# ============================================================
*.zonalHost.numApps = 1
*.zonalHost.app[0].typename = "UdpSourceApp"
*.zonalHost.app[0].io.destAddress = "centralHost"
*.zonalHost.app[0].io.destPort = 5004
*.zonalHost.app[0].source.packetLength = 20B
*.zonalHost.app[0].source.productionInterval = 500us
*.zonalHost.app[0].source.initialProductionOffset = 0us

# Stream identification + PCP encoding — PCP=7 (Luo item 2: "highest priority")
*.zonalHost.hasOutgoingStreams = true
*.zonalHost.bridging.streamIdentifier.identifier.mapping = [{stream: "control", packetFilter: expr(has(udp) && udp.destPort == 5004)}]
*.zonalHost.bridging.streamCoder.encoder.mapping = [{stream: "control", pcp: 7}]
# PCP=5 is unique to attack stream — decoder matches on pcp alone, no source/filter needed.
# PCP tag matching is proven to work (same mechanism as all other streams).
*.viuSwitch.bridging.streamCoder.decoder.mapping = [{pcp:5,stream:"attack"},{source:"av1",pcp:4,stream:"av1"},{source:"av2",pcp:4,stream:"av2"},{source:"radarNode",pcp:4,stream:"radar"},{source:"zonalHost",pcp:7,stream:"control"}]
*.vcuSwitch.bridging.streamCoder.decoder.mapping = [{pcp:5,stream:"attack"},{source:"av1",pcp:4,stream:"av1"},{source:"av2",pcp:4,stream:"av2"},{source:"radarNode",pcp:4,stream:"radar"},{source:"zonalHost",pcp:7,stream:"control"}]
# ============================================================
# PSFP STREAM FILTER — viuSwitch
# gateIndexOffset=1 is CONFIRMED active in INET StreamClassifier.
# Classifier mapping value N routes to gate N+1.
# So mapping {"av1":0,...,"attack":4} routes:
#   av1→gate1, av2→gate2, radar→gate3, control→gate4, attack→gate5
# numStreams=6 allocates gates 0..5.
# Gate 0 = default/unmatched; must be configured to avoid "unassigned" errors.
# Streams live at filter/meter indices 1..5.
# ============================================================
*.viuSwitch.bridging.streamFilter.ingress.numStreams = 6
*.viuSwitch.bridging.streamFilter.ingress.classifier.mapping = {"av1":0,"av2":1,"radar":2,"control":3,"attack":4}

# Gate 0: default passthrough — must be fully configured or INET errors on init
*.viuSwitch.bridging.streamFilter.ingress.filter[0].streamName = "default"
*.viuSwitch.bridging.streamFilter.ingress.meter[0].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 100Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[0].committedBurstSize = 100000B

# Stream filters at actual gate indices 1..5
*.viuSwitch.bridging.streamFilter.ingress.filter[1].streamName = "av1"
*.viuSwitch.bridging.streamFilter.ingress.filter[2].streamName = "av2"
*.viuSwitch.bridging.streamFilter.ingress.filter[3].streamName = "radar"
*.viuSwitch.bridging.streamFilter.ingress.filter[4].streamName = "control"
*.viuSwitch.bridging.streamFilter.ingress.filter[5].streamName = "attack"

# Flow meters at actual gate indices 1..5
*.viuSwitch.bridging.streamFilter.ingress.meter[1].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[1].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[2].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[2].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[2].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[3].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[3].committedInformationRate = 1Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[3].committedBurstSize = 1002B
# meter[4] processes attack stream (classifier offset means attack→gate5→meter4 in stats)
# meter[5] is the offset-corrected attack meter — keep both at CIR=0 to catch all attack traffic
*.viuSwitch.bridging.streamFilter.ingress.meter[4].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 100Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 0B
# Attack: CIR=0 — all attack packets marked red and dropped immediately
*.viuSwitch.bridging.streamFilter.ingress.meter[5].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 0bps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 0B

# ============================================================
# PSFP STREAM FILTER — vcuSwitch (mirrors viuSwitch)
# ============================================================
*.vcuSwitch.bridging.streamFilter.ingress.numStreams = 6
*.vcuSwitch.bridging.streamFilter.ingress.classifier.mapping = {"av1":0,"av2":1,"radar":2,"control":3,"attack":4}

*.vcuSwitch.bridging.streamFilter.ingress.filter[0].streamName = "default"
*.vcuSwitch.bridging.streamFilter.ingress.meter[0].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 100Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[0].committedBurstSize = 100000B

*.vcuSwitch.bridging.streamFilter.ingress.filter[1].streamName = "av1"
*.vcuSwitch.bridging.streamFilter.ingress.filter[2].streamName = "av2"
*.vcuSwitch.bridging.streamFilter.ingress.filter[3].streamName = "radar"
*.vcuSwitch.bridging.streamFilter.ingress.filter[4].streamName = "control"
*.vcuSwitch.bridging.streamFilter.ingress.filter[5].streamName = "attack"

*.vcuSwitch.bridging.streamFilter.ingress.meter[1].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[1].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[2].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[2].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[2].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[3].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[3].committedInformationRate = 1Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[3].committedBurstSize = 1002B
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 100Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 100000B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 0bps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 0B



# ============================================================
# CENTRALHOST SINKS — 4 ports
# ============================================================
*.centralHost.numApps = 5
*.centralHost.app[0].typename = "UdpSinkApp"
*.centralHost.app[0].io.localPort = 5001
*.centralHost.app[1].typename = "UdpSinkApp"
*.centralHost.app[1].io.localPort = 5002
*.centralHost.app[2].typename = "UdpSinkApp"
*.centralHost.app[2].io.localPort = 5003
*.centralHost.app[3].typename = "UdpSinkApp"
*.centralHost.app[3].io.localPort = 5004
*.centralHost.app[4].typename = "UdpSinkApp"
*.centralHost.app[4].io.localPort = 6001

# Incoming stream decoding at centralHost
*.centralHost.hasIncomingStreams = true
# ============================================================
# PCAP RECORDING — enable for baseline verification
# ============================================================
*.viuSwitch.recordPcap = false
*.vcuSwitch.recordPcap = false
*.centralHost.recordPcap = false

# ============================================================
# STATISTICS — collect mean E2E delay to match Luo Table 9
*.centralHost.bridging.streamCoder.decoder.mapping = [{source: "av1", pcp: 4, stream: "av1"}, {source: "av2", pcp: 4, stream: "av2"}, {source: "radarNode", pcp: 4, stream: "radar"}, {source: "zonalHost", pcp: 7, stream: "control"},{source: "attackNode", pcp: 5, stream: "attack"}]

# ============================================================
# ATTACK NODE
# ============================================================

*.attackNode.numApps = 0
*.attackNode.app[0].typename = "UdpSourceApp"

*.attackNode.app[0].io.destAddress = "centralHost"
*.attackNode.app[0].io.destPort = 6001

*.attackNode.app[0].source.packetLength = 2000B
*.attackNode.app[0].source.productionInterval = 90us
*.attackNode.app[0].source.initialProductionOffset = 50us
*.attackNode.hasOutgoingStreams = true

# packetFilter matches on destPort 6001 — same pattern as all working streams
*.attackNode.bridging.streamIdentifier.identifier.mapping = [{stream:"attack", packetFilter: expr(has(udp) && udp.destPort == 6001)}]

*.attackNode.bridging.streamCoder.encoder.mapping = [{stream:"attack", pcp:5}]
[Config ThresholdEvasionAttack]
extends = General
description = "V3 proof: sub-threshold sustained attack. Luo ADS alarm = 0, AV1 delay degrades."

# --- Enable attack node ---
*.attackNode.numApps = 1

# --- Frame size: 529B = maxMsdu - 1 ---
# One byte below the 530B StreamFilter MSDU limit.
# Every frame passes the size check. Luo gateDrops = 0.
*.attackNode.app[0].source.packetLength = 529B

# --- Interval: 193us → 21.927 Mbps ---
# Token bucket analysis:
#   Arrival rate  = 22.000 Mbps = 2,750,000 B/s
#   Consume rate  = 21.927 Mbps = 2,740,933 B/s
#   Net gain      = +9,067 B/s → bucket stays positive → all GREEN
# Luo meterRedFrames = 0 for all 777 frames in 150ms run.
*.attackNode.app[0].source.productionInterval = 193us

# --- Offset: 130us (inside gate-open window 125-450us) ---
# Ensures frames land in the open Q0-Q6 window so TAS does not add
# gate-related drops on top of our attack.  The V3 proof is about
# FlowMeter blindness, not TAS; keep TAS out of the picture.
*.attackNode.app[0].source.initialProductionOffset = 130us

# --- Attack stream meter: CIR=22Mbps / CBS=5004B (AV1 limits) ---
# This is the CORRECT setting for V3 proof.
# The attacker models a node that has been GRANTED AV1-level PSFP limits
# (e.g., by spoofing its stream identity or via a compromised provisioning step).
# With these limits and a rate of 21.93 Mbps, the meter never fires RED.
#
# CONTRAST with OversizeAttack config where meter[5] = CIR=0 (catches oversize).
# Here we give the attacker full AV1 credit — Luo cannot distinguish it.
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

# --- PCAP: viuSwitch only ---
# Capture attack + AV1/AV2 frames at the ingress switch for IAT feature extraction.
# viuSwitch PCAP gives you timestamps of every frame — needed for mean_IAT, IAT_var.
# centralHost PCAP gives you E2E delay measurements (compare send vs receive time).
*.viuSwitch.recordPcap = false
*.vcuSwitch.recordPcap = false
*.centralHost.recordPcap = false
[Config LowAndSlowDriftAttack]
extends = General
description = "Gap 3: phase drift in full Luo2021Network. gateDrops=0, meterRed=0, AV1 delay trends up."

# --- CRITICAL: swap UdpSourceApp for the INET-integrated drift app ---
*.attackNode.numApps = 1
*.attackNode.app[0].typename = "LowAndSlowDriftApp"

# Destination: centralHost UdpSinkApp already listening on port 6001 (General)
*.attackNode.app[0].destAddress = "centralHost"
*.attackNode.app[0].destPort    = 6001
*.attackNode.app[0].localPort   = 6100

# Attack parameters — identical to the standalone module
*.attackNode.app[0].attackStartTime = 0.001s
*.attackNode.app[0].nominalInterval = 90us
*.attackNode.app[0].driftPerPacket  = 0.09us
*.attackNode.app[0].payloadSize     = 500

# Meter: CIR=22Mbps/CBS=5004B — rate evasion (rate drifts DOWN, never RED)
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

*.viuSwitch.recordPcap  = false
*.vcuSwitch.recordPcap  = false
*.centralHost.recordPcap = false


# ============================================================
# CONFIG: ScheduleAwareBurstAttack  (INTEGRATED — thesis-valid)
#
# Gap 4 proof — TAS Schedule Knowledge Exploitation.
# NOW runs through the FULL Luo2021Network PSFP pipeline via
# ScheduleAwareBurstApp (INET ApplicationBase, implements IApp).
#
# Attack runs INSIDE attackNode (TsnDevice), traversing:
#   ScheduleAwareBurstApp (7-frame burst every 1.82ms at gate-open)
#   → attackNode PCP encoder (PCP=5, stream="attack")
#   → viuSwitch PSFP (StreamFilter → FlowMeter → StreamGate)
#   → TAS egress queue (shared with AV1/AV2/Radar)
#   → vcuSwitch → centralHost UdpSinkApp
#
# Thesis-valid claims:
#   gateDrops      = 0    (burst at 127µs, gate open at 125µs)
#   meterRedFrames = 0    (3703B burst < CBS 5004B, avg 16.28Mbps < CIR)
#   qciAlarm       = false
#   AV1 E2E delay  = SPIKES +253µs every 1.82ms (82 times in 150ms)
#   recordScalar "totalBursts"     ≈ 82
#   recordScalar "totalFramesSent" ≈ 574
#   recordScalar "avgBurstRate_Mbps" ≈ 16.28
#
# Run: opp_run -c ScheduleAwareBurstAttack
# Save: saved_results/schedule_aware_burst/
# ============================================================

