*.attackNode.app[0].gateOpenOffset     = 125us
*.attackNode.app[0].burstGuardOffset   = 2us
*.attackNode.app[0].burstSize          = 7
*.attackNode.app[0].intraburstSpacing  = 0.1us
*.attackNode.app[0].interburstInterval = 1820us
*.attackNode.app[0].payloadSize        = 529

