[Config ScheduleAwareBurstAttack]
extends = General
description = "Gap 4: burst at gate-open in full Luo2021Network. gateDrops=0, meterRed=0, AV1 delay spikes."

# --- CRITICAL: swap UdpSourceApp for the INET-integrated burst app ---
*.attackNode.numApps = 1
*.attackNode.app[0].typename = "ScheduleAwareBurstApp"

*.attackNode.app[0].destAddress = "centralHost"
*.attackNode.app[0].destPort    = 6001
*.attackNode.app[0].localPort   = 6101

# Attack parameters — identical to the standalone module
