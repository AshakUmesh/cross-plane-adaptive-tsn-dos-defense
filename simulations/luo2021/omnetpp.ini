# ============================================================
# CONFIG: SustainedNearCIRAttack
#
# What it proves: Long-duration below-CIR attack causes COMPOUNDING
# delay degradation. Unlike ThresholdEvasionAttack (which measures
# instantaneous delay increase), this proves that sustained sub-CIR
# traffic causes AV1 jitter to accumulate across hundreds of cycles.
#
# Rate = 21.93 Mbps < CIR(22 Mbps) → FlowMeter GREEN always.
# Frame size = 529B < maxMsdu → StreamFilter PASS always.
# BUT: the 21.93 Mbps sustained load displaces AV1's fair share of
# the port bandwidth cycle after cycle. Over 150ms (300 GCL cycles),
# the compounding queuing delay makes AV1 worst-case delay grow.
#
# Distinct from ThresholdEvasionAttack: same rate, different observable.
# ThresholdEvasion measures PER-CYCLE delay impact.
# SustainedNearCIR measures the CUMULATIVE / TRENDING delay over time.
# This is the input to your LSTM: trending AV1 delay = attack signature.
#
# Previously broken because: meter[5]=CIR=0 in General dropped everything.
# Fix: add meter override here.
#
# Run: opp_run -c SustainedNearCIRAttack
# Key: plot AV1 E2E delay as time series — expect upward trend over 150ms
# ============================================================

[Config SustainedNearCIRAttack]
extends = General
description = "Sustained 21.93Mbps sub-CIR load. Compounding AV1 jitter trend. Luo: no alarm."

*.attackNode.numApps = 1

*.attackNode.app[0].source.packetLength = 529B
*.attackNode.app[0].source.productionInterval = 193us
*.attackNode.app[0].source.initialProductionOffset = 130us

# CRITICAL FIX: was missing in original — without this, General's CIR=0
# drops all attack frames immediately, giving 0 damage and no evasion shown.
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

*.viuSwitch.recordPcap = false
*.vcuSwitch.recordPcap = false
*.centralHost.recordPcap = false


# ============================================================
# CONFIG: CBSBoundaryAttack
#
# What it proves: Attacker rides the CBS boundary — sends exactly
# CBS-worth of data per GCL cycle. Each cycle: 9 × 529B = 4761B
# injected at interval=55µs. Token bucket drains 4761B, then refills
# from CIR. Every frame GREEN every cycle. No RED ever. No alarm ever.
#
# The attacker exploits the CBS reset mechanism itself:
# - Each cycle, CBS is fresh (refilled by CIR)
# - Attacker sends exactly CBS bytes → all GREEN
# - Rate = 529×8/55µs = 76.95 Mbps → far above CIR
# - BUT: each burst is CBS-sized → each burst is all-GREEN
#
# This is distinct from CBSExhaustionAttack (which proves detection latency
# after CBS runs out). CBSBoundaryAttack proves that the CBS mechanism
# can be ridden indefinitely with zero RED frames if burst ≤ CBS bytes.
#
# Previously called VariableRateThresholdAttack — that was misleading.
# The attack is actually a CBS-aware repeating burst.
#
# Run: opp_run -c CBSBoundaryAttack
# Key: meterRedFrames=0 THROUGHOUT despite 76.95 Mbps attack rate
# ============================================================

