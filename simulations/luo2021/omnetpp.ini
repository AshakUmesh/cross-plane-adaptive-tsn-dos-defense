# attack frames are released simultaneously with legitimate AV1 frames
# that also queued during 100-125µs. This creates a synthetic burst
# at gate-open without the attacker ever sending a burst explicitly.
#
# Luo 2021 has no mechanism to detect pre-queued frame accumulation.
# The StreamGate counts frames that ARRIVE during the OPEN window.
# Pre-queued frames are released during the open window → counted as PASS.
# No per-cycle queue-depth tracking exists in Luo's ADS.
#
# Run: opp_run -c WindowBoundaryQueuingAttack
# Key result: AV1 delay increases at gate-open moments
#             gateDrops=0 (all frames queued then released during open)
# ============================================================

[Config Baseline]
extends = General
description = "No attack. Collect WCD/PDV baseline matching Luo 2021 Table 9."

# Attack node stays disabled (numApps=0 from General)
# Nothing to override — this is the clean baseline.


# ============================================================
# CONFIG: GCLPhaseAttack
#
# V1 + V3 vulnerability proof:
#   V1 — GCL-phase timing attack: attacker sends at 40us interval with
#        initialProductionOffset=130us so frames land inside the Q0-Q6
#        gate-open window (125-450us). Each frame arrives at a VALID
#        gate-open timestamp → StreamGate: PASS.
#
#   V3 — Below-threshold evasion: frame size = 529B < maxMsdu (530B),
#        so StreamFilter size check: PASS.
#        meter CIR = 22Mbps / CBS = 5004B matches AV1 stream limits.
#        First 9 frames (9 × 529B = 4761B < 5004B CBS) are GREEN.
#        After CBS exhausted the meter marks frames RED and drops them,
#        but by then AV1/AV2 delay has already increased.
#
# What Luo 2021 sees:
#   gateDrops = 0          (all attack frames pass the gate)
#   meterGreenFrames > 0   (CBS absorbs the initial burst)
#   qciAlarm = false       (no PSFP violation triggered)
#
# What YOU measure:
#   AV1 E2E delay INCREASED vs Baseline (queue contention during CBS window)
#   AV2 E2E delay INCREASED vs Baseline
#   mean_IAT of attack = 40us << normal 90us (2.25x anomaly for IsoForest)
#
# Run: opp_run -c GCLPhaseAttack
# Save results to: saved_results/gcl_phase_attack/
# ============================================================

[Config GCLPhaseAttack]
extends = General
description = "GCL-phase burst attack. Proves V1+V3: gate passes all frames, Luo alarm = 0."

# --- Enable attack node ---
*.attackNode.numApps = 1

# --- Frame size: 529B = maxMsdu-1 ---
# One byte below the 530B StreamFilter MSDU limit.
# Passes the size check on every frame. Proves V3 (threshold evasion).
*.attackNode.app[0].source.packetLength = 529B

# --- Burst interval: 40us ---
# Normal AV1 interval = 90us. Attack = 40us = 2.25x faster.
# At 40us spacing, ~8-9 consecutive frames fit inside the 325us open
# window (125-450us) before phase drift causes some to fall outside.
# Frames outside the window are dropped by TAS (expected, not our metric).
# Frames inside the window: IAT = 40us → strong IsoForest anomaly signal.
*.attackNode.app[0].source.productionInterval = 40us

# --- Offset: 130us ---
# 5us after the Q0-Q6 gate opens at 125us.
# Ensures the first burst lands cleanly inside the open window.
# Phase drifts over subsequent cycles due to 40us not dividing 500us evenly,
# but a consistent majority (~64%) of frames land inside the window.
*.attackNode.app[0].source.initialProductionOffset = 130us

# --- Attack stream meter: CIR=22Mbps / CBS=5004B (same as AV1) ---
# CRITICAL CHANGE from General config (which has CIR=0 for OversizeAttack).
# Setting CIR=22Mbps mirrors the legitimate AV1 flow meter limits.
# This models an attacker who knows the PSFP configuration (V3 assumption).
# Result: the meter cannot distinguish attacker from a legitimate AV stream
# until the burst exceeds CBS. First 9 frames (9×529B=4761B) are GREEN.
# Luo 2021 sees ZERO alarms for those 9 frames → vulnerability proven.
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

# --- Enable PCAP for evidence and feature extraction ---
# PCAP gives you the per-frame timestamps needed for IAT computation in Python.
# Disable after collecting data (adds ~10% simulation overhead).
*.viuSwitch.recordPcap = false
*.vcuSwitch.recordPcap = false
*.centralHost.recordPcap = false
