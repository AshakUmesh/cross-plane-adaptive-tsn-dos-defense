# ============================================================
# CONFIG: MultiFlowCoordinatedAttack
#
# Proves that Luo 2021 PSFP is blind to AGGREGATE load because
# it evaluates each stream independently in isolation.
#
# ATTACK MODEL:
#   3 attackers (attackNode, attackNode2, attackNode3)
#   Each sends at 7 Mbps — well below CIR (22 Mbps)
#   Each attacker's meter shows GREEN on every frame
#   No individual stream alarm fires
#
#   AGGREGATE: 3 × 7 = 21 Mbps attack
#   + AV1 (44.4 Mbps) + AV2 (44.4 Mbps) + Radar (1 Mbps)
#   = ~110.9 Mbps total on 100 Mbps link
#   → Queue builds → AV1/AV2 E2E delay increases
#   → Luo ADS: all three meters GREEN, qciAlarm = false
#
# WHY LUO CANNOT DETECT THIS:
#   meter[5] (attack1): 7 Mbps < CIR(22 Mbps) → GREEN
#   meter[6] (attack2): 7 Mbps < CIR(22 Mbps) → GREEN
#   meter[7] (attack3): 7 Mbps < CIR(22 Mbps) → GREEN
#   No cross-stream rate aggregator exists in PSFP.
#   Luo's paper never discusses aggregate-rate enforcement.
#
# WHAT YOUR DETECTOR SEES:
#   Three simultaneous streams with anomalous IAT patterns
#   Aggregate feature: total_stream_count per 10ms window = 3
#   (benign baseline: 1 attack stream = 0 streams from attackNode*)
#   Cross-stream correlation: 3 correlated anomaly scores → ATTACK
#
# PSFP STREAM CONFIG:
#   attack1 (attackNode):  PCP=5, meter[5], source:attackNode
#   attack2 (attackNode2): PCP=5, meter[6], source:attackNode2
#   attack3 (attackNode3): PCP=5, meter[7], source:attackNode3
#   numStreams = 8 (5 legitimate + 3 attack)
#
# Run: opp_run -c MultiFlowCoordinatedAttack
# Key results:
#   meter[5/6/7].greenFrames = all (each 7 Mbps < CIR)
#   meter[5/6/7].redFrames   = 0
#   AV1/AV2 E2E delay: INCREASED (110.9 Mbps on 100 Mbps link)
# ============================================================
[Config MultiFlowCoordinatedAttack]
extends = General
description = "3 coordinated attackers, each below CIR. Luo: 0 alarms. Aggregate load saturates link."

# ---- Enable all three attack nodes ----
*.attackNode.numApps  = 1
*.attackNode2.numApps = 1
*.attackNode3.numApps = 1

# ---- All three send 529B at 605us = 7 Mbps each ----
*.attackNode.app[0].source.packetLength          = 529B
*.attackNode.app[0].source.productionInterval    = 605us
*.attackNode.app[0].source.initialProductionOffset = 130us

*.attackNode2.app[0].source.packetLength          = 529B
*.attackNode2.app[0].source.productionInterval    = 605us
*.attackNode2.app[0].source.initialProductionOffset = 140us

*.attackNode3.app[0].source.packetLength          = 529B
*.attackNode3.app[0].source.productionInterval    = 605us
*.attackNode3.app[0].source.initialProductionOffset = 155us

# ---- Decoder: distinguish all three attack streams by source ----
*.viuSwitch.bridging.streamCoder.decoder.mapping = [\
  {source:"attackNode",  pcp:5, stream:"attack1"},\
  {source:"attackNode2", pcp:5, stream:"attack2"},\
  {source:"attackNode3", pcp:5, stream:"attack3"},\
  {source:"av1",      pcp:4, stream:"av1"},\
  {source:"av2",      pcp:4, stream:"av2"},\
  {source:"radarNode",pcp:4, stream:"radar"},\
  {source:"zonalHost",pcp:7, stream:"control"}\
]
*.vcuSwitch.bridging.streamCoder.decoder.mapping = [\
  {source:"attackNode",  pcp:5, stream:"attack1"},\
  {source:"attackNode2", pcp:5, stream:"attack2"},\
  {source:"attackNode3", pcp:5, stream:"attack3"},\
  {source:"av1",      pcp:4, stream:"av1"},\
  {source:"av2",      pcp:4, stream:"av2"},\
  {source:"radarNode",pcp:4, stream:"radar"},\
  {source:"zonalHost",pcp:7, stream:"control"}\
]

# ---- PSFP: 8 streams (5 legitimate + 3 attack) ----
*.viuSwitch.bridging.streamFilter.ingress.numStreams = 8
*.viuSwitch.bridging.streamFilter.ingress.classifier.mapping = \
  {"av1":0,"av2":1,"radar":2,"control":3,"attack1":4,"attack2":5,"attack3":6}

*.viuSwitch.bridging.streamFilter.ingress.filter[5].streamName = "attack1"
*.viuSwitch.bridging.streamFilter.ingress.filter[6].streamName = "attack2"
*.viuSwitch.bridging.streamFilter.ingress.filter[7].streamName = "attack3"

# Each attack stream: CIR=22Mbps, CBS=5004B
# At 7 Mbps each → always GREEN → Luo meter fires never
*.viuSwitch.bridging.streamFilter.ingress.meter[5].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[6].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[6].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[6].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[7].typename = "SingleRateTwoColorMeter"
*.viuSwitch.bridging.streamFilter.ingress.meter[7].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[7].committedBurstSize = 5004B

*.vcuSwitch.bridging.streamFilter.ingress.numStreams = 8
*.vcuSwitch.bridging.streamFilter.ingress.classifier.mapping = \
  {"av1":0,"av2":1,"radar":2,"control":3,"attack1":4,"attack2":5,"attack3":6}

*.vcuSwitch.bridging.streamFilter.ingress.filter[5].streamName = "attack1"
*.vcuSwitch.bridging.streamFilter.ingress.filter[6].streamName = "attack2"
*.vcuSwitch.bridging.streamFilter.ingress.filter[7].streamName = "attack3"

*.vcuSwitch.bridging.streamFilter.ingress.meter[5].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[6].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[6].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[6].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[7].typename = "SingleRateTwoColorMeter"
*.vcuSwitch.bridging.streamFilter.ingress.meter[7].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[7].committedBurstSize = 5004B

*.viuSwitch.recordPcap  = false
*.vcuSwitch.recordPcap  = false
*.centralHost.recordPcap = false


# ============================================================
# CONFIG: IdentityMimicryAttack
#
# Proves that Luo 2021 PSFP stream identification can be subverted
# by an attacker who sends frames matching a legitimate stream's
# PCP tag and destination port — causing attack traffic to be
# classified as a legitimate stream and measured by that stream's
# meter instead of the attack meter.
#
# ATTACK MODEL:
#   mimicryNode sends to destPort=5001 with PCP=4
#   (identical to av1: destPort=5001, PCP=4)
#
#   The switch decoder normally distinguishes av1 by source IP:
#     {source:"av1", pcp:4, stream:"av1"}
#   This config removes the source constraint for PCP=4:
#     {pcp:4, stream:"av1"}   ← matches ANY source with PCP=4
#   mimicryNode traffic is now classified as "av1" by the switch.
#
# CONSEQUENCE IN LUO 2021:
#   mimicry frames go through meter[1] (av1's meter, CIR=22Mbps)
#   mimicryNode sends at 500B/90us = 44.44 Mbps
#   meter[1] CBS = 5004B → absorbs 9 frames GREEN then RED
#   RED frames are DROPPED — but Luo cannot tell if the dropped
#   frames are from av1 or mimicryNode.
#   The real av1 camera stream also gets CBS contention → some av1
#   frames are delayed or dropped, but the alarm shows "av1 anomaly"
#   not "attack detected". Luo's ADS cannot attribute the cause.
#
# WHY THIS IS WORSE THAN SIMPLE FLOODING:
#   Simple flooding: meter[5] detects immediately (CIR=0 in General)
#   Mimicry: attack bypasses attack meter entirely, enters av1 meter
#   The alarm (if any) appears on a legitimate stream → false attribution
#   Operator sees "av1 stream anomaly" not "attack" → wrong response
#
# IMPLEMENTATION NOTE:
#   No MAC/IP spoofing needed — only PCP tag and port matching.
#   The switch decoder is configured to match PCP=4 without source check.
#   This models a realistic insider threat or a compromised ECU that
#   generates valid-looking av1 traffic without being av1.
#
# Run: opp_run -c IdentityMimicryAttack
# Key results:
#   meter[1] (av1 meter) redFrames > 0 — but attributed to "av1"
#   meter[5] (attack meter) redFrames = 0 — attack invisible here
#   AV1 E2E delay: INCREASED (shared meter with mimicry traffic)
#   Luo alarm: appears on av1 stream, not attack stream → misattribution
# ============================================================
[Config IdentityMimicryAttack]
extends = General
description = "Mimicry of av1 stream via PCP=4/port=5001. Attack classified as av1. Luo misattributes."

# ---- Enable mimicry node ----
*.mimicryNode.numApps = 1

# ---- Mimic av1 exactly: 500B at 90us, PCP=4, destPort=5001 ----
*.mimicryNode.app[0].source.packetLength           = 500B
*.mimicryNode.app[0].source.productionInterval     = 90us
# Stagger slightly from real av1 (offset=100us) to create contention
*.mimicryNode.app[0].source.initialProductionOffset = 103us

# ---- Decoder: remove source constraint on PCP=4 ----
# Standard config: {source:"av1", pcp:4, stream:"av1"} — source-checked
# Mimicry config:  {pcp:4, stream:"av1"} — ANY PCP=4 frame = "av1"
# This is the vulnerability: Luo's PSFP cannot enforce source identity.
# An attacker with PCP=4 frames will be classified as a legitimate stream.
*.viuSwitch.bridging.streamCoder.decoder.mapping = [\
  {source:"attackNode", pcp:5, stream:"attack"},\
  {pcp:4, stream:"av1"},\
  {source:"zonalHost",  pcp:7, stream:"control"}\
]
*.vcuSwitch.bridging.streamCoder.decoder.mapping = [\
  {source:"attackNode", pcp:5, stream:"attack"},\
  {pcp:4, stream:"av1"},\
  {source:"zonalHost",  pcp:7, stream:"control"}\
]

# ---- meter[1] (av1 meter): CIR=22Mbps, CBS=5004B ----
# mimicry + real av1 both go through this meter.
# Combined rate = 44.44 + 44.44 = 88.88 Mbps >> CIR(22Mbps)
# CBS=5004B exhausted in 9 frames → meter fires RED on av1 stream
# Luo sees: av1 meterRedFrames > 0 → alarm on av1 (not on attack)
*.viuSwitch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[1].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[1].committedBurstSize = 5004B

# attack meter[5]: CIR=0 (would detect real attack, but mimicry bypasses it)
# This highlights the bypass: meter[5] sees 0 attack traffic
# because mimicry frames are classified as av1, not attack.
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 0bps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 0B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 0bps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 0B

*.viuSwitch.recordPcap  = false
*.vcuSwitch.recordPcap  = false
*.centralHost.recordPcap = false
