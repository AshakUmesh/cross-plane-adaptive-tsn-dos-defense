# ============================================================
# CONFIG: CBSBoundaryAttack
#
# What it proves: Attacker rides the CBS boundary — sends exactly
# CBS-worth of data per GCL cycle. Each cycle: 9 × 529B = 4761B
# injected at interval=55µs. Token bucket drains 4761B, then refills
# from CIR. Every frame GREEN every cycle. No RED ever. No alarm ever.
#
# The attacker exploits the CBS reset mechanism itself:
# - Each cycle, CBS is fresh (refilled by CIR)
# - Attacker sends exactly CBS bytes → all GREEN
# - Rate = 529×8/55µs = 76.95 Mbps → far above CIR
# - BUT: each burst is CBS-sized → each burst is all-GREEN
#
# This is distinct from CBSExhaustionAttack (which proves detection latency
# after CBS runs out). CBSBoundaryAttack proves that the CBS mechanism
# can be ridden indefinitely with zero RED frames if burst ≤ CBS bytes.
#
# Previously called VariableRateThresholdAttack — that was misleading.
# The attack is actually a CBS-aware repeating burst.
#
# Run: opp_run -c CBSBoundaryAttack
# Key: meterRedFrames=0 THROUGHOUT despite 76.95 Mbps attack rate
# ============================================================
[Config CBSBoundaryAttack]
extends = General
description = "Ride CBS boundary: 9 frames×529B per cycle, all GREEN, meterRed=0 always."

*.attackNode.numApps = 1

# 529×8/55us = 76.95 Mbps >> CIR but CBS=5004B per burst → all GREEN
# interval=55us: 9 frames × 55us = 495us ≈ one full cycle (500us)
# Each burst stays within CBS → token bucket refills before next burst
*.attackNode.app[0].source.packetLength = 529B
*.attackNode.app[0].source.productionInterval = 55us
*.attackNode.app[0].source.initialProductionOffset = 130us

# AV1 meter limits: CBS=5004B is exactly what the attack exploits
