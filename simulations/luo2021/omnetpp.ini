*.attackNode.app[0].source.productionInterval = 90us
*.attackNode.app[0].source.initialProductionOffset = 135us

*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 100Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 100000B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 100Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 100000B
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 100Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 100000B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 100Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 100000B

*.viuSwitch.recordPcap = true
*.vcuSwitch.recordPcap = true
*.centralHost.recordPcap = true


# ============================================================
# CONFIG: ScheduleAwareBurstAttack
#
# Gap 4 vulnerability proof — TAS Schedule Knowledge Exploitation.
#
# Attack exploits the SHARED egress queue: all Q0-Q6 streams share the
# same 125-450µs gate-open window. An attacker who knows the GCL schedule
# fires a coordinated burst at gate-open, occupying the queue before
# legitimate AV1/AV2 frames can be served.
#
# TRIPLE EVASION — why Luo 2021 raises zero alarms:
#
#   StreamFilter (MSDU):
#     Frame size = 529B < maxMsdu(530B) → PASS on every frame
#     filterDrops = 0 always
#
#   FlowMeter (token bucket):
#     Burst bytes = 7 × 529B = 3703B < CBS(5004B) → all 7 frames GREEN
#     Average rate = 16.28 Mbps < CIR(22 Mbps) → bucket always positive
#     meterRedFrames = 0 always
#
#   StreamGate (timing):
#     All burst frames arrive at t=127µs (gateOpen=125µs + guard=2µs)
#     Gate is open → PASS on every frame
#     gateDrops = 0 always
#
# Observable damage:
#   AV1 E2E delay += 253.92µs per burst (6 frames blocking queue at t=190µs)
#   AV2 E2E delay degrades similarly
#   Bursts repeat every 1.82ms → 82 bursts in 150ms → sustained degradation
#
# Your IsoForest detects from window 1:
#   burst_length = 7   (benign = 1)    ← primary feature, immediate outlier
#   IAT_variance ≈ 1.58M µs²           ← bimodal: 42µs intra vs 1820µs inter
#
# Distinction from GCLPhaseAttack (V1):
#   V1: uniform ~40µs IAT throughout window, rate continuously elevated
#   Gap4: bimodal IAT (tight burst then long silence), attacks queue not meter
#
# Run:      opp_run -c ScheduleAwareBurstAttack
# Save to:  saved_results/schedule_aware_burst/
# Measure:  AV1/AV2 E2E delay (expect +250µs spikes every 1.82ms)
#           scalar gateDrops (expect 0 — this is the key Luo failure proof)
#           scalar meterRedFrames (expect 0 — FlowMeter completely blind)
# ============================================================
[Config ScheduleAwareBurstAttack]
extends = General
description = "Gap 4 proof: schedule-aware burst at gate-open. Queue fills, Luo alarm = 0."

# --- Enable attack node ---
*.attackNode.numApps = 1
*.attackNode.app[0].typename = "src.attacks.ScheduleAwareBurstApp"
# --- Frame size: 529B = maxMsdu - 1 ---
# Passes StreamFilter MSDU check (limit=530B) on every frame.
*.attackNode.app[0].source.packetLength = 529B

# --- Interval: 42us ≈ frame tx time (near back-to-back within burst) ---
# UdpSourceApp sends at a fixed interval — it cannot model burst-then-silence.
# Setting interval=42µs approximates the intra-burst transmission rate.
# For the precise burst pattern (tight burst then 1820µs silence), use the
# ScheduleAwareBurstAttack module in ScheduleAwareBurstAttackTest.ned.
# In the full Luo2021Network this config measures queue contention impact.
*.attackNode.app[0].source.productionInterval = 42us

# --- Offset: 127us = gateOpenOffset(125us) + guard(2us) ---
# First frame arrives 2µs after gate opens at 125µs.
# All subsequent frames at 42µs spacing also land inside 125-450µs window:
#   127, 169, 211, 253, 295, 337, 379, 421 → all inside [125, 450]
# Gate passes all frames → gateDrops = 0 → Luo detection = zero.
*.attackNode.app[0].source.initialProductionOffset = 127us

# --- Attack stream meter: CIR=22Mbps / CBS=5004B ---
# Gives the attacker AV1-level meter limits — same values as legitimate AV1.
# At 42µs interval, rate = 529×8/42µs = 100.76 Mbps.
# CBS = 5004B → first 9 frames (4761B) GREEN before meter fires RED.
# After RED: meter drains, CBS refills, cycle repeats.
# The POINT: in the time between GREEN start and first RED (=CBS period),
# the queue is already full and AV1 delay has already spiked.
# The meter fires too late to prevent damage — this IS the V1 argument
# applied to the burst context. Luo's alarm comes after harm is done.
#
# Set to 22Mbps/5004B (not CIR=0) to model attacker with provisioned access.
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.viuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[4].committedBurstSize = 5004B
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedInformationRate = 22Mbps
*.vcuSwitch.bridging.streamFilter.ingress.meter[5].committedBurstSize = 5004B

# --- PCAP: all three nodes ---
# viuSwitch: per-frame timestamps for burst_length + IAT_variance computation
# centralHost: E2E delay measurement (compare send time vs receive time)
# Both needed: viuSwitch shows attack structure, centralHost shows damage.
*.viuSwitch.recordPcap = false
*.vcuSwitch.recordPcap = false
*.centralHost.recordPcap = false

