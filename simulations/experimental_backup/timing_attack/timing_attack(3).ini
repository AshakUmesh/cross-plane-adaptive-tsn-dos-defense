# ─────────────────────────────────────────────────────────────────────────────
# omnetpp.ini — V1 Timing Attack Experiment Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Project : Cross-Plane Adaptive DoS Defence for Automotive TSN
# Student : Ashak Umesh (M250691CS), NIT Calicut
# Purpose : Run the V1 GCL-phase timing attack to prove Luo 2021 cannot
#           detect burst flooding that stays inside the gate-open window.
#
# Experiment structure:
#   [General]          → common settings (RNG, logging)
#   [Config Baseline]  → no attack, establishes normal AV1/AV2 WCD/PDV
#   [Config V1_Timing] → attack at 9µs interval, attack active t=50ms..150ms
#   [Config V1_Timing_NoDefence] → Luo 2021 ADS only (proves V1 gap)
#
# Key parameters from Luo 2021 Table 7 / Table 8:
#   GCL period         500 µs
#   Q7 window          0–125 µs
#   Q4/AV1 window      125–450 µs
#   ALL-CLOSED guard   450–500 µs
#   AV1/AV2 VLAN       10, PCP=4
#   AV1 CIR            22 Mbps, CBS=5004 B, MSDU=530 B
#   AV1 declared rate  ~90 µs inter-frame (400–500 B, ~6.4 Mbps)
#   Radar VLAN         20, PCP=6, CIR=1 Mbps, CBS=1002 B, MSDU=100 B
# ─────────────────────────────────────────────────────────────────────────────

[General]
# ── Simulation basics ────────────────────────────────────────────────────────
network            = luo2021.Luo2021Network
sim-time-limit     = 0.200s        # 200ms: 50ms baseline + 100ms attack + 50ms recovery

# ── Random number generation ─────────────────────────────────────────────────
rng-class          = cMersenneTwister
seed-set           = ${repetition}

# ── Output files ─────────────────────────────────────────────────────────────
result-dir         = results
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
eventlog-file      = ${resultdir}/${configname}-${runnumber}.elog

# ── Logging: show WARN and above so attack events are visible ────────────────
**.cmdenv-log-level = warn

# ── PCAP recording: capture all traffic for Python feature extraction ─────────
**.switch1.**.recordPcap         = true
**.switch2.**.recordPcap         = true
**.pcapRecorder.verbose          = false
**.pcapRecorder.pcapFile         = "${resultdir}/${configname}-${runnumber}-switch.pcap"

# ── TSN / gPTP global sync ────────────────────────────────────────────────────
**.gptpNodeType                  = "MASTER_NODE"
**.clockModule                   = "^.clock"
**.gptp.syncInterval             = 0.125s     # 125ms sync interval (standard gPTP)
**.gptp.pdelayInitialInterval    = 0.008s

# ─────────────────────────────────────────────────────────────────────────────
# [Config Baseline]
# Normal operation — no attack. Run first to establish:
#   - WCD for each stream (should match Luo 2021 Table 9)
#   - PDV (packet delay variation) — should be near-zero
#   - Zero drops (filterDrops=0, gateDrops=0, meterDrops=0)
# ─────────────────────────────────────────────────────────────────────────────
[Config Baseline]
description = "Luo 2021 normal operation — no attack. Validates topology."

# Disable attacker
**.attacker.attackStartTime      = 9999s      # never fires
**.attacker.attackStopTime       = 9999s

# Legitimate stream parameters (AV1 — matches Luo 2021 Table 7)
**.av1Sender.sendInterval        = 90us       # 90 µs inter-frame (declared rate)
**.av1Sender.packetLength        = 450B       # within MSDU=530B
**.av1Sender.destAddress         = "01:00:5E:00:00:01"

# AV2 stream
**.av2Sender.sendInterval        = 90us
**.av2Sender.packetLength        = 450B
**.av2Sender.destAddress         = "01:00:5E:00:00:02"

# Radar stream (low rate, small frames)
**.radarSender.sendInterval      = 1ms
**.radarSender.packetLength      = 80B        # within MSDU=100B

# Control stream
**.controlSender.sendInterval    = 5ms
**.controlSender.packetLength    = 50B

# Record WCD and delay for all streams
**.av1Receiver.**.vector-recording  = true
**.av2Receiver.**.vector-recording  = true
**.radarReceiver.**.vector-recording= true

# ─────────────────────────────────────────────────────────────────────────────
# [Config V1_Timing]
# THE KEY EXPERIMENT: V1 timing attack active from t=50ms to t=150ms.
#
# Attack parameters:
#   interval = 9 µs (10× legitimate rate)
#   size     = 450 B (< MSDU=530B → passes MSDU check)
#   VLAN=10, PCP=4, DestMAC=AV1 → passes stream filter
#   Each frame timed inside gate window 125–450 µs → passes gate
#
# EXPECTED OUTCOME (Luo 2021 ADS):
#   filterDrops = 0  (stream filter passes all: correct VLAN/PCP/MAC)
#   gateDrops   = 0  (gate passes all: correct timing window)
#   meterDrops  ↑    (flow meter fires ONLY after CBS=5004B absorbed)
#   av1_delay   ↑↑   (legitimate AV1 frames starved → E2E delay spikes)
#   av2_delay   ↑    (collateral: AV2 also affected by queue congestion)
#
# WHAT YOUR PROPOSAL SEES (10ms window feature vector):
#   mean_IAT   ≈ 9 µs   (vs normal 90 µs → 10× anomaly → IsoForest flags)
#   IAT_var    ↑↑        (bursty pattern → flags burst_length feature)
#   phase_offset_sigma ↑ (tightly clustered offsets → phase attack signature)
# ─────────────────────────────────────────────────────────────────────────────
[Config V1_Timing]
description = "V1 timing attack: 9µs interval, inside gate-open window. Luo 2021 fails. Yours detects."
extends     = Baseline

# ── Attacker configuration ───────────────────────────────────────────────────
**.attacker.attackStartTime      = 0.050s     # attack begins at t=50ms
**.attacker.attackStopTime       = 0.150s     # attack ends at t=150ms
**.attacker.attackInterval_us    = 9          # 9 µs = 10× declared AV1 rate
**.attacker.frameSize_bytes      = 450        # same size as AV1 → passes MSDU=530B
**.attacker.targetVlanId         = 10         # AV1 VLAN → passes stream filter
**.attacker.targetPcp            = 4          # AV1 PCP → passes priority filter
**.attacker.targetDestMac        = "01:00:5E:00:00:01"   # AV1 dest → passes MAC filter
**.attacker.gcl_period_us        = 500        # match Luo 2021 GCL period
**.attacker.gcl_open_start_us    = 125        # AV1 window open offset
**.attacker.gcl_open_end_us      = 450        # AV1 window close offset
**.attacker.phase_jitter_us      = 0.5        # ±0.5µs realistic timing noise

# ── Record everything for analysis ───────────────────────────────────────────
**.attacker.**.vector-recording  = true
**.switch1.psfp.**.vector-recording = true

# ─────────────────────────────────────────────────────────────────────────────
# [Config V1_Fast]
# Same attack but at 4.5 µs interval (20× rate) to stress-test CBS saturation
# timing. Shows how quickly legitimate traffic is impacted.
# ─────────────────────────────────────────────────────────────────────────────
[Config V1_Fast]
description = "V1 fast variant: 4.5µs interval (20× rate). CBS exhausted faster."
extends     = V1_Timing

**.attacker.attackInterval_us    = 4.5        # 20× declared AV1 rate
**.attacker.frameSize_bytes      = 490        # near-MSDU-limit

# ─────────────────────────────────────────────────────────────────────────────
# [Config V1_Stealthy]
# Moderate 3× rate (30 µs interval) — tests detection near threshold boundary.
# Luo flow meter may never fire (27 Mbps > 22 Mbps CIR, but CBS absorbs bursts).
# Your IsoForest still detects: mean_IAT = 30 µs (vs normal 90 µs).
# ─────────────────────────────────────────────────────────────────────────────
[Config V1_Stealthy]
description = "V1 stealthy: 30µs interval (3× rate). Tests IsoForest sensitivity near threshold."
extends     = V1_Timing

**.attacker.attackInterval_us    = 30         # 3× declared AV1 rate
**.attacker.frameSize_bytes      = 420

# ─────────────────────────────────────────────────────────────────────────────
# [Config V1_BandwidthEvasion]
# V3 evasion: attacker sends at exactly CIR-1 = 21 Mbps (just below meter).
# Frame size: 529 bytes (1 below MSDU=530). Luo 2021 NEVER fires any alarm.
# Your IsoForest flags: mean_IAT differs from 90µs baseline.
# This is the "threshold evasion" attack for V3 vulnerability proof.
# ─────────────────────────────────────────────────────────────────────────────
[Config V1_BandwidthEvasion]
description = "V3 bandwidth evasion: 21 Mbps (< CIR=22 Mbps), 529B (< MSDU=530). Luo sees zero alarms."
extends     = Baseline

**.attacker.attackStartTime      = 0.050s
**.attacker.attackStopTime       = 0.150s
# 529 bytes * 8 bits / 21 Mbps = ~0.202 µs per bit → period = ~202 µs per frame at 21 Mbps
# interval = 529*8 / 21e6 = ~0.000000201s = ~201 µs
**.attacker.attackInterval_us    = 201        # tuned to hit exactly 21 Mbps
**.attacker.frameSize_bytes      = 529        # 1 byte below MSDU=530 → passes size check
**.attacker.targetVlanId         = 10
**.attacker.targetPcp            = 4
**.attacker.targetDestMac        = "01:00:5E:00:00:01"
**.attacker.gcl_period_us        = 500
**.attacker.gcl_open_start_us    = 125
**.attacker.gcl_open_end_us      = 450
**.attacker.phase_jitter_us      = 1.0        # more jitter to look "natural"

# ─────────────────────────────────────────────────────────────────────────────
# PSFP parameters — matching Luo 2021 Table 7
# These are applied to switch1 (the VIU switch where ADS runs)
# ─────────────────────────────────────────────────────────────────────────────

# Stream filter for AV1 (Port 1 → VCU)
**.switch1.psfp.streamFilter[0].vlanId    = 10
**.switch1.psfp.streamFilter[0].pcp       = 4
**.switch1.psfp.streamFilter[0].destMac   = "01:00:5E:00:00:01"
**.switch1.psfp.streamFilter[0].meterId   = 0
**.switch1.psfp.streamFilter[0].gateId    = 0

# Stream filter for AV2 (Port 2)
**.switch1.psfp.streamFilter[1].vlanId    = 10
**.switch1.psfp.streamFilter[1].pcp       = 4
**.switch1.psfp.streamFilter[1].destMac   = "01:00:5E:00:00:02"
**.switch1.psfp.streamFilter[1].meterId   = 1
**.switch1.psfp.streamFilter[1].gateId    = 0

# Flow meter for AV1/AV2 (Table 7: CIR=22Mbps, CBS=5004B, MSDU=530B)
**.switch1.psfp.meter[0].cir              = 22000000bps   # 22 Mbps
**.switch1.psfp.meter[0].cbs             = 5004B          # committed burst size
**.switch1.psfp.meter[0].maxSdu          = 530B           # MSDU limit

**.switch1.psfp.meter[1].cir             = 22000000bps
**.switch1.psfp.meter[1].cbs             = 5004B
**.switch1.psfp.meter[1].maxSdu         = 530B

# Stream gate for AV (gate 0, schedule: 125–450 µs open)
**.switch1.psfp.gate[0].gclPeriod        = 500us
**.switch1.psfp.gate[0].adminGateStates  = "O C O"
**.switch1.psfp.gate[0].adminTimeIntervals= "125us 325us 50us"
#   125µs = Q7 slot (closed for Q4), 325µs = Q4/AV open, 50µs = guard band

# Stream filter for Radar (Port 3, Table 7: CIR=1Mbps, CBS=1002B, MSDU=100B)
**.switch1.psfp.streamFilter[2].vlanId   = 20
**.switch1.psfp.streamFilter[2].pcp      = 6
**.switch1.psfp.streamFilter[2].destMac  = "01:00:5E:00:01:01"
**.switch1.psfp.streamFilter[2].meterId  = 2
**.switch1.psfp.streamFilter[2].gateId   = 1

**.switch1.psfp.meter[2].cir             = 1000000bps     # 1 Mbps
**.switch1.psfp.meter[2].cbs             = 1002B
**.switch1.psfp.meter[2].maxSdu         = 100B

# ─────────────────────────────────────────────────────────────────────────────
# Repeat each config 3 times for statistical reliability
# ─────────────────────────────────────────────────────────────────────────────
repeat = 3
